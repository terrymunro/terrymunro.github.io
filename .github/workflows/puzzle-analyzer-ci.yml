name: puzzle-analyzer CI

on:
  pull_request:
    paths:
      - "puzzle-analyzer/**"
      - ".github/workflows/puzzle-analyzer-ci.yml"
  push:
    branches: [main]
    paths:
      - "puzzle-analyzer/**"
      - ".github/workflows/puzzle-analyzer-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puzzle-analyzer
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: puzzle-analyzer/uv.lock

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest
