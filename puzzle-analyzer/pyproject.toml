[project]
name = "puzzle-analyzer"
version = "2.0.0"
description = "Validate, grade, annotate and harden logic puzzles (sudoku, nonogram, kenken, kakuro, skyscrapers, star battle, bridges, zebra, cryptogram, word ladder, and more) with Google OR-Tools."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "ortools>=9.11",
]

[project.scripts]
puzzle-analyzer = "puzzle_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
allowed-confusables = ["×", "−", "÷"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — enforces modern syntax
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
